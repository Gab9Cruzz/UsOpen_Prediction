# Automatización web: corre el pipeline de predicción existente + el
# exportador JSON, y commitea SOLO el JSON (nunca database/us_open.db ni
# data/raw/*.csv -- son artefactos regenerables, no fuente) si el resultado
# cambió.
#
# Trigger: `schedule` ÚNICAMENTE -- nunca `push`/`pull_request_target`. Esto
# evita el loop de auto-disparo (el propio commit del bot dispararía el
# workflow de nuevo) y, en un repo público, un trigger de PR con permisos de
# escritura es un patrón de ataque conocido -- ni siquiera está en la lista
# acá. `workflow_dispatch` sí se agrega para poder disparar una corrida
# manual de prueba desde la pestaña Actions (un humano con permiso de
# escritura en el repo, no un tercero).
name: Actualizar predicción

on:
  schedule:
    # Ventana aproximada del US Open (defensa primaria -- el cron ni
    # siquiera dispara fuera de estas fechas, así no se gastan minutos de CI
    # en un no-op). MANTENIMIENTO ANUAL: actualizar estos dos rangos según
    # las fechas oficiales de cada edición (mismo rango que el chequeo de
    # ventana más abajo -- tocar los dos juntos).
    - cron: "0 5 18-31 8 *"  # 18-31 de agosto, 05:00 UTC (~medianoche US Eastern)
    - cron: "0 5 1-14 9 *"   # 1-14 de septiembre, 05:00 UTC
  workflow_dispatch: {}

# Sin esto, dos corridas superpuestas (cron + un workflow_dispatch manual, o
# dos manuales seguidos) hacen CADA UNA su propio checkout+commit+push sobre
# la MISMA base de `main` -- la segunda en llegar al `git push` se rechaza
# ("! [rejected] main -> main (fetch first)", visto en una corrida real) sin
# reintento ni pull, y esa corrida completa (varios minutos de descarga +
# simulación) se pierde. `cancel-in-progress: false`: encolar, no cancelar --
# la corrida en curso nunca se corta a mitad del `git push`, la siguiente
# arranca recién cuando termina, con un checkout ya al día.
concurrency:
  group: actualizar-prediccion
  cancel-in-progress: false

# Desde 2023 GitHub crea los repos nuevos con GITHUB_TOKEN de solo lectura
# por default -- sin esto el `git push` del paso de commit falla con 403
# (además hace falta el toggle "Read and write permissions" en
# Settings -> Actions -> General -> Workflow permissions del repo -- este
# `permissions:` es el techo, no lo reemplaza).
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Chequear ventana del torneo (defensa secundaria, red de seguridad)
        id: window
        run: |
          TODAY=$(date -u +%m-%d)
          # Mismo rango que los cron de arriba -- MANTENIMIENTO ANUAL: tocar
          # los dos juntos.
          START="08-18"
          END="09-14"
          if [[ "$TODAY" > "$START" || "$TODAY" == "$START" ]] && [[ "$TODAY" < "$END" || "$TODAY" == "$END" ]]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
            echo "Dentro de la ventana del torneo ($START a $END UTC) -- corriendo el pipeline."
          else
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            echo "Fuera de la ventana del torneo ($START a $END UTC) -- no-op limpio, sin correr el pipeline."
          fi

      - uses: actions/setup-python@v6
        if: steps.window.outputs.in_window == 'true'
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        if: steps.window.outputs.in_window == 'true'
        run: pip install -r requirements.txt

      - name: Generar predicción y exportar JSON
        if: steps.window.outputs.in_window == 'true'
        run: |
          # --draw-year explícito, SIEMPRE (hallazgo CRÍTICO del plan,
          # sección 3.2): config.DEFAULT_DRAW_YEAR está hardcodeado a 2025 --
          # sin este flag, la automatización simularía el torneo 2025 (ya
          # jugado) para siempre, en silencio, sin que el job falle ni se
          # note. `$(date +%Y)` además elimina el mantenimiento anual de
          # bumpear el año a mano.
          #
          # Ninguna supresión de errores acá (nada de `|| true` ni
          # `continue-on-error`) -- si esto falla de verdad (Wikipedia
          # cambió su formato, el mirror de CSV está caído), el job debe
          # quedar en rojo y notificar, no tragarse el error en las dos
          # semanas del año en que la corrección importa de verdad.
          python simular_usopen.py \
            --update-data \
            --draw-year "$(date +%Y)" \
            --export-json docs/data/resultados_simulacion.json

      - name: Commitear el JSON si cambió
        if: steps.window.outputs.in_window == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `checkout` (primer paso del job) tomó `main` hace varios minutos
          # -- todo lo que pasó desde entonces (descarga + `--update-data` +
          # miles de simulaciones) es tiempo en el que `main` pudo moverse de
          # verdad (otro push directo, no solo otra corrida de este mismo
          # workflow -- `concurrency:` de arriba solo serializa corridas de
          # ESTE workflow entre sí, no protege contra un push manual mientras
          # una corrida está en el medio; visto en corridas reales: un push
          # directo a `main` durante la simulación hizo que el `git push` de
          # acá se rechazara, "! [rejected] main -> main (fetch first)", dos
          # veces seguidas, perdiendo la corrida completa cada vez).
          #
          # Guarda el JSON recién generado aparte, sincroniza el repo del
          # runner al tip REAL de `main` (`reset --hard`, no `--soft`: hace
          # falta que el ÍNDICE también quede al día, no solo el puntero de
          # HEAD -- si `main` avanzó con cambios en OTROS archivos mientras
          # corría la simulación, un `--soft` los revertiría sin querer en
          # este commit, porque el índice seguiría reflejando el checkout
          # viejo) y recién ahí pisa el JSON con la versión fresca. Así el
          # diff/commit/push de abajo corren contra la base más nueva posible
          # -- ventana de carrera de milisegundos, no minutos. Se pierden a
          # propósito los cambios sin commitear en database/us_open.db y
          # data/raw/*.csv (nunca se commitean igual, ver más abajo).
          cp docs/data/resultados_simulacion.json "$RUNNER_TEMP/resultados_simulacion.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/resultados_simulacion.json" docs/data/resultados_simulacion.json
          # Solo se stagea el JSON -- database/us_open.db y data/raw/*.csv
          # quedan modificados en el working tree del runner pero nunca se
          # commitean (se descartan solos cuando el runner se destruye al
          # terminar el job). Commit condicional: sin esto, cada corrida
          # generaría un commit aunque nada haya cambiado -- ruido en el
          # historial.
          if git diff --quiet -- docs/data/resultados_simulacion.json; then
            echo "Sin cambios en la predicción -- nada para commitear."
          else
            git add docs/data/resultados_simulacion.json
            git commit -m "chore(data): actualizar predicción $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
